<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Our Team</h1>
        </div>
        <div class="cards-container">
            
            <div class="card">
                <div class="card-image">
                    <img src="./images/image1.png"
                    alt="1">
                </div>
                <div class="card-info">
                    <div class="card-name">
                        <h3>Jerry Helfer</h3>
                    </div>
                    <div class="card-role">
                        <p>CEO</p>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-image">
                    <img src="./images/image2.png"
                    alt="2">
                </div>
                <div class="card-info">
                    <div class="card-name">
                        <h3>Mary Freund</h3>
                    </div>
                    <div class="card-role">
                        <p>Product Designer</p>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-image">
                    <img src="./images/image3.png"
                    alt="3">
                </div>
                <div class="card-info">
                    <div class="card-name">
                        <h3><span style="color: #008FFF;">Kurt Bates</span></h3>
                    </div>
                    <div class="card-role">
                        <p>Content Manager</p>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-image">
                    <img src="./images/image4.png"
                    alt="4">
                </div>
                <div class="card-info">
                    <div class="card-name">
                        <h3>Daniel Hamilton</h3>
                    </div>
                    <div class="card-role">
                        <p>UX Designer</p>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-image">
                    <img src="./images/image5.png"
                    alt="5">
                </div>
                <div class="card-info">
                    <div class="card-name">
                        <h3>Stephanie Nicol</h3>
                    </div>
                    <div class="card-role">
                        <p>Marketing Manager</p>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-image">
                    <img src="./images/image6.png"
                    alt="6">
                </div>
                <div class="card-info">
                    <div class="card-name">
                        <h3>David Elson</h3>
                    </div>
                    <div class="card-role">
                        <p>System Administrator</p>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-image">
                    <img src="./images/image7.png"
                    alt="7">
                </div>
                <div class="card-info">
                    <div class="card-name">
                        <h3>Ricky Smith</h3>
                    </div>
                    <div class="card-role">
                        <p>Front end Developer</p>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-image">
                    <img src="./images/image8.png"
                    alt="8">
                </div>
                <div class="card-info">
                    <div class="card-name">
                        <h3>James Hall</h3>
                    </div>
                    <div class="card-role">
                        <p>Social Media Manager</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
